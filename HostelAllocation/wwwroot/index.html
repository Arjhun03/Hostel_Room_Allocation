<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Room Allocation Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(148, 163, 184, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }

    .brand-text h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(120deg, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(148, 163, 184, 0.2);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      opacity: 0.6;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.35rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
    }

    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .room-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .room-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .room-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .room-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .room-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .tag-single {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .tag-shared {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .room-fee {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
    }

    .fee-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .fee-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--success);
    }

    .room-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .room-actions .btn {
      flex: 1;
      justify-content: center;
      padding: 0.45rem;
      font-size: 0.8rem;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h2 {
      font-size: 1.25rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      color: #fff;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }

    .modal-footer {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">🏨</div>
        <div class="brand-text">
          <h1>Hostel Room Allocation</h1>
          <span class="status-badge" id="dbStatus">
            <span class="status-dot"></span> SQL Server Connected
          </span>
        </div>
      </div>
      <div class="header-actions">
        <a href="/scalar/v1" target="_blank" class="btn btn-secondary">
          ⚡ Interactive API Docs (Scalar)
        </a>
        <button class="btn btn-primary" onclick="openCreateModal()">
          + Add New Room
        </button>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-title">Total Rooms</span>
        <span class="stat-value" id="statTotalRooms">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">Total Capacity</span>
        <span class="stat-value" id="statCapacity">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">Occupied Beds</span>
        <span class="stat-value" id="statOccupied">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">Available Beds</span>
        <span class="stat-value" id="statAvailable">0</span>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="controls-bar">
      <div class="filter-tabs">
        <button class="filter-btn active" id="filterAll" onclick="setFilter(false)">All Rooms</button>
        <button class="filter-btn" id="filterAvailable" onclick="setFilter(true)">Available Only</button>
      </div>
      <button class="btn btn-secondary" onclick="fetchRooms()">🔄 Refresh</button>
    </div>

    <!-- Rooms Grid -->
    <div class="rooms-grid" id="roomsContainer">
      <p style="color: var(--text-muted);">Loading rooms...</p>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div class="modal-overlay" id="roomModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Room</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="roomForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="roomId" />
        <div class="form-group">
          <label>Room Number</label>
          <input type="text" id="roomNumber" class="form-control" placeholder="e.g. A102" required />
        </div>
        <div class="form-group">
          <label>Room Type</label>
          <select id="roomType" class="form-control" required onchange="handleTypeChange()">
            <option value="Shared">Shared</option>
            <option value="Single">Single</option>
          </select>
        </div>
        <div class="form-group">
          <label>Capacity (Beds)</label>
          <input type="number" id="capacity" class="form-control" min="1" value="4" required />
        </div>
        <div class="form-group">
          <label>Occupied Beds</label>
          <input type="number" id="occupiedBeds" class="form-control" min="0" value="0" required />
        </div>
        <div class="form-group">
          <label>Monthly Fee (₹)</label>
          <input type="number" id="monthlyFee" class="form-control" min="0" step="0.01" value="3500" required />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Room</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentRooms = [];
    let filterAvailableOnly = false;

    async function fetchRooms() {
      try {
        const url = `/api/rooms${filterAvailableOnly ? '?availableOnly=true' : ''}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('API error');
        currentRooms = await res.json();
        renderStats();
        renderRooms(currentRooms);
      } catch (err) {
        document.getElementById('roomsContainer').innerHTML = `
          <div style="grid-column: 1/-1; padding: 2rem; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); border-radius: 12px; text-align: center;">
            <p style="color: var(--danger); font-weight: 600;">Failed to load rooms from API</p>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Ensure the backend server is running on http://localhost:5007</p>
          </div>
        `;
      }
    }

    function renderStats() {
      // Fetch full list for stats calculation
      fetch('/api/rooms')
        .then(r => r.json())
        .then(all => {
          const totalRooms = all.length;
          const totalCapacity = all.reduce((acc, r) => acc + r.capacity, 0);
          const totalOccupied = all.reduce((acc, r) => acc + r.occupiedBeds, 0);
          const totalAvailable = totalCapacity - totalOccupied;

          document.getElementById('statTotalRooms').textContent = totalRooms;
          document.getElementById('statCapacity').textContent = totalCapacity;
          document.getElementById('statOccupied').textContent = totalOccupied;
          document.getElementById('statAvailable').textContent = totalAvailable;
        })
        .catch(() => {});
    }

    function renderRooms(rooms) {
      const container = document.getElementById('roomsContainer');
      if (rooms.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; padding: 3rem; text-align: center; color: var(--text-muted);">
            <h3>No rooms found</h3>
            <p style="margin-top: 0.5rem;">Click "Add New Room" above to create one.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = rooms.map(room => {
        const available = room.capacity - room.occupiedBeds;
        const pct = Math.round((room.occupiedBeds / room.capacity) * 100);
        const barColor = pct >= 100 ? 'var(--danger)' : (pct >= 75 ? 'var(--warning)' : 'var(--success)');
        const tagClass = room.roomType.toLowerCase() === 'single' ? 'tag-single' : 'tag-shared';

        return `
          <div class="room-card" id="room-${room.id}">
            <div class="room-card-header">
              <div>
                <div class="room-title">Room ${room.roomNumber}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem;">ID: #${room.id}</div>
              </div>
              <span class="room-tag ${tagClass}">${room.roomType}</span>
            </div>

            <div class="progress-container">
              <div class="progress-labels">
                <span>Occupancy (${room.occupiedBeds}/${room.capacity})</span>
                <span style="font-weight: 600; color: ${barColor}">${available} Bed${available === 1 ? '' : 's'} Free</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${pct}%; background-color: ${barColor};"></div>
              </div>
            </div>

            <div class="room-fee">
              <span class="fee-label">Monthly Rent</span>
              <span class="fee-value">₹${Number(room.monthlyFee).toLocaleString()}</span>
            </div>

            <div class="room-actions">
              <button class="btn btn-secondary" onclick='openEditModal(${JSON.stringify(room)})'>✏️ Edit</button>
              <button class="btn btn-delete" onclick="deleteRoom(${room.id})">🗑️ Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setFilter(availableOnly) {
      filterAvailableOnly = availableOnly;
      document.getElementById('filterAll').classList.toggle('active', !availableOnly);
      document.getElementById('filterAvailable').classList.toggle('active', availableOnly);
      fetchRooms();
    }

    function handleTypeChange() {
      const type = document.getElementById('roomType').value;
      if (type === 'Single') {
        document.getElementById('capacity').value = 1;
      }
    }

    function openCreateModal() {
      document.getElementById('modalTitle').textContent = 'Add New Room';
      document.getElementById('roomId').value = '';
      document.getElementById('roomForm').reset();
      document.getElementById('roomModal').classList.add('open');
    }

    function openEditModal(room) {
      document.getElementById('modalTitle').textContent = `Edit Room ${room.roomNumber}`;
      document.getElementById('roomId').value = room.id;
      document.getElementById('roomNumber').value = room.roomNumber;
      document.getElementById('roomType').value = room.roomType;
      document.getElementById('capacity').value = room.capacity;
      document.getElementById('occupiedBeds').value = room.occupiedBeds;
      document.getElementById('monthlyFee').value = room.monthlyFee;
      document.getElementById('roomModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('roomModal').classList.remove('open');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('roomId').value;
      const room = {
        roomNumber: document.getElementById('roomNumber').value.trim(),
        roomType: document.getElementById('roomType').value,
        capacity: parseInt(document.getElementById('capacity').value),
        occupiedBeds: parseInt(document.getElementById('occupiedBeds').value),
        monthlyFee: parseFloat(document.getElementById('monthlyFee').value)
      };

      if (room.occupiedBeds > room.capacity) {
        alert('Occupied beds cannot exceed total capacity!');
        return;
      }

      try {
        let res;
        if (id) {
          room.id = parseInt(id);
          res = await fetch(`/api/rooms/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(room)
          });
        } else {
          res = await fetch('/api/rooms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(room)
          });
        }

        if (!res.ok) {
          const errData = await res.json();
          alert(errData.message || 'Operation failed');
          return;
        }

        closeModal();
        fetchRooms();
      } catch (err) {
        alert('Error saving room.');
      }
    }

    async function deleteRoom(id) {
      if (!confirm('Are you sure you want to delete this room?')) return;
      try {
        const res = await fetch(`/api/rooms/${id}`, { method: 'DELETE' });
        if (res.ok) {
          fetchRooms();
        } else {
          alert('Failed to delete room.');
        }
      } catch (err) {
        alert('Error deleting room.');
      }
    }

    // Initial load
    fetchRooms();
  </script>
</body>
</html>
